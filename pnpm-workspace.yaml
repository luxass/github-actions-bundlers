ignoreScripts: true
minimumReleaseAge: 7200
trustPolicy: no-downgrade
catalogMode: prefer
strictDepBuilds: true
blockExoticSubdeps: true

packages:
  - actions/**

catalogs:
  # bunchee specific dependencies
  bunchee-bundler:
    bunchee: 7.0.2

  # general dev dependencies
  dev:
    "@types/node": 26.6.6
    oxfmt: 0.75.0
    oxlint: 1.90.0
    oxlint-tsgolint: 7.0.2005
    turbo: 2.11.10
    typescript: 5.9.3

  # esbuild specific dependencies
  esbuild-bundler:
    esbuild: 0.28.2

  # ncc specific dependencies
  ncc-bundler:
    "@vercel/ncc": 0.45.0

  # prod dependencies
  prod:
    "@actions/core": 3.0.1

  # rolldown specific dependencies
  rolldown-bundler:
    rolldown: 1.2.16

  # rollup specific dependencies
  rollup-bundler:
    "@rollup/plugin-commonjs": 29.0.3
    "@rollup/plugin-json": 6.1.0
    "@rollup/plugin-node-resolve": 16.0.3
    "@rollup/plugin-typescript": 12.3.1
    rollup: 4.67.4
    tslib: 2.9.1

  # rspack specific dependencies
  rspack-bundler:
    "@rspack/cli": 2.3.0
    "@rspack/core": 2.3.0

  # tsup specific dependencies
  tsup-bundler:
    tsup: 8.5.1

  # vite specific dependencies
  vite-bundler:
    vite: 8.3.5

  # webpack specific dependencies
  webpack-bundler:
    ts-loader: 9.6.2
    webpack: 5.112.2
    webpack-cli: 7.3.1

allowBuilds:
  "@swc/core": true
  esbuild: true

overrides:
  rolldown: catalog:rolldown-bundler
  chokidar: 5.0.0
