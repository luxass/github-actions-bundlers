ignoreScripts: true
minimumReleaseAge: 7200
trustPolicy: no-downgrade
catalogMode: prefer
strictDepBuilds: true
blockExoticSubdeps: true

packages:
  - actions/**

catalogs:
  # bunchee specific dependencies
  bunchee-bundler:
    bunchee: 6.9.4

  # general dev dependencies
  dev:
    "@types/node": 22.18.6
    oxfmt: 0.75.0
    oxlint: 1.90.0
    oxlint-tsgolint: 7.0.2005
    turbo: 2.8.17
    typescript: 5.9.3

  # esbuild specific dependencies
  esbuild-bundler:
    esbuild: 0.27.4

  # ncc specific dependencies
  ncc-bundler:
    "@vercel/ncc": 0.38.4

  # prod dependencies
  prod:
    "@actions/core": 3.0.0

  # rolldown specific dependencies
  rolldown-bundler:
    rolldown: 1.2.16

  # rollup specific dependencies
  rollup-bundler:
    "@rollup/plugin-commonjs": 29.0.2
    "@rollup/plugin-json": 6.1.0
    "@rollup/plugin-node-resolve": 16.0.3
    "@rollup/plugin-typescript": 12.3.0
    rollup: 4.59.0
    tslib: 2.8.1

  # rspack specific dependencies
  rspack-bundler:
    "@rspack/cli": 1.7.8
    "@rspack/core": 1.7.8

  # tsup specific dependencies
  tsup-bundler:
    tsup: 8.5.1

  # vite specific dependencies
  vite-bundler:
    vite: 8.3.5

  # webpack specific dependencies
  webpack-bundler:
    ts-loader: 9.5.4
    webpack: 5.105.4
    webpack-cli: 7.0.0

allowBuilds:
  "@swc/core": true
  esbuild: true

overrides:
  rolldown: catalog:rolldown-bundler
  chokidar: 5.0.0
  undici-types: 6.29.1
